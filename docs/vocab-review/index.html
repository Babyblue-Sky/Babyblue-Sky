<style>

 such as food and housing] to pay for a nice vacation each year.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/d/discre09.mp3"}, {"word": "abdicate", "type": "word", "definition": "to leave the position of being a king or queen", "example": "The king was forced to abdicate.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/abdica01.mp3"}, {"word": "abdomen", "type": "word", "definition": "the part of the body below the chest that contains the stomach and other organs", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/abdome01.mp3"}, {"word": "abhorrent", "type": "word", "definition": "causing or deserving strong dislike or hatred \u2014sometimes + to", "example": "She finds violence in films abhorrent.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/abhorr03.mp3"}, {"word": "abhorrer", "type": "word", "definition": "to regard with extreme repugnance : to feel hatred or loathing for : loathe", "example": "abhorred violence", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/abhor001.mp3"}, {"word": "abjure", "type": "word", "definition": "to reject (something) formally", "example": "He abjured [=renounced] allegiance to his native country.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/abjure01.mp3"}, {"word": "abominable", "type": "word", "definition": "very bad or unpleasant", "example": "It was an abominable crime.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/abomin01.mp3"}, {"word": "absolve", "type": "word", "definition": "to make (someone) free from guilt, responsibility, etc.", "example": "He was absolved of the responsibility of repaying the loan. [=he was not required to repay the loan]", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/absolv02.mp3"}, {"word": "abstain", "type": "word", "definition": "to choose not to do or have something\u2014usually + tes him even more.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/agitat01.mp3"}, {"word": "agnostic", "type": "word", "definition": "a person who does not have a definite belief about whether God exists or not", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/agnost01.mp3"}, {"word": "agonizing", "type": "word", "definition": "very mentally or physically painful", "example": "a long and agonizing battle with cancer", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/agonizing_1.mp3"}, {"word": "agrarian", "type": "word", "definition": "of or relating to farms and farming", "example": "a town founded in 1811 as an agrarian community", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/agrari01.mp3"}, {"word": "alchemist", "type": "word", "definition": "a science that was used in the Middle Ages with the goal of changing ordinary metals into gold", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/alchem05.mp3"}, {"word": "algorithm", "type": "word", "definition": "a set of steps that are followed in order to solve a mathematical problem or to complete a computer process", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/algori01.mp3"}, {"word": "allegorical", "type": "word", "definition": "a story in which the characters and events are symbols that stand for ideas about human life or for a political or historical situation", "example": "the long poem is an allegory of/about love and jealousy", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/allego07.mp3"}, {"word": "allot", "type": "word", "definition": "to give someone (an amount of something) to use or have", "example": "Each speaker will be allotted 15 minutes.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/allot001.mp3"}, {"word": "almanack", "type": "word", "definition": "", "example": "", "audioUrl": ""}, {"word": "ambergris", "type": "word", "definition": "a waxy substance found floating in or on the shores of tropical waters, believed to originate in the intestines of the sperm whale, and used in perfumery as a fixative", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/amberg01.mp3"}, {"word": "ambient", "type": "word", "definition": "surrounding on all sides", "example": "Keep the chemicals at an ambient temperature of 70\u00b0F.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/ambien03.mp3"}, {"word": "ambivalent", "type": "word", "definition": "having or showing very different feelings (such as love and hate) about someone or something at the same time", "example": "He felt ambivalent about his job. [=he both liked and disliked his job]", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/ambiva02.mp3"}, {"word": "ameliorate", "type": "word", "definition": "to make (something, such as a problem) better, less painful, etc.", "example": "trying to ameliorate the suffering of people who have lost their jobs", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/amelio01.mp3"}, {"word": "amenable", "type": "word", "definition": "willing to agree or to accept something that is wanted or asked for \u2014usually + to", "example": "an amenable child", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/amenab02.mp3"}, {"word": "amends", "type": "word", "definition": "", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/amends01.mp3"}, {"word": "amicable", "type": "word", "definition": "showing a polite and friendly desire to avoid disagreement and argument", "example": "The discussions were amicable.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/amicab01.mp3"}, {"word": "ammunition", "type": "word", "definition": "the objects (such as bullets and shells) that are shot from ": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/ancill03.mp3"}, {"word": "androgen", "type": "word", "definition": "a male sex hormone (such as testosterone)", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/androg01.mp3"}, {"word": "anecdote", "type": "word", "definition": "a short story about an interesting or funny event or occurrence", "example": "He told us all sorts of humorous anecdotes about his childhood.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/anecdo07.mp3"}, {"word": "anemia", "type": "word", "definition": "a condition in which a person has fewer red blood cells than normal and feels very weak and tired", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/anemia01.mp3"}, {"word": "aneurism", "type": "word", "definition": "an abnormal blood-filled bulge of a blood vessel and especially an artery resulting from weakening (as from disease) of the vessel wall", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/aneury01.mp3"}, {"word": "anguish", "type": "word", "definition": "extreme suffering, grief, or pain", "example": "tears/cries of anguish", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/anguis01.mp3"}, {"word": "annihilate", "type": "word", "definition": "to destroy (something or someone) completely", "example": "Bombs annihilated the city.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/annihi01.mp3"}, {"word": "anoint", "type": "word", "definition": "to put oil on (someone) as part of a religious ceremony", "example": "The priest anointed them (with oil).", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/anoint01.mp3"}, {"word": "anomalous", "type": "word", "definition": "not expected or usual", "example": "Researchers could not explain the anomalous test results.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/anomal01.mp3"}, {"word": "anomaly", "type": "word", "definition": "something that is unusual or unexpected : something anomalous", "example": "A storm like that is an anomaly for this area. [=a storm like that does not usually happen in this area]", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/anomal02.mp3"}, {"word": "anorexic", "type": "word", "definition": "a serious physical and emotional illness in which an abnormal fear of being fat leads to very poor eating habits and dangerous weight loss \u2014called also anorexia nervosa", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/anorex01.mp3"}, {"word": "antagonize", "type": "word", "definition": "to cause (someone) to feel hostile or angry : to irritate or upset (someone)", "example": "He didn't mean to antagonize you.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/antago05.mp3"}, {"word": "antenna", "type": "word", "definition": "a thin sensitive organ on the head of an insect, crab, etc., that is used mainly to feel and touch things\u2014sometimes used figuratively", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/antenn01.mp3"}, {"word": "apathetic", "type": "word", "definition": "not having or showing much emotion or interest", "example": "Young people are becoming increasingly apathetic.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/apathe01.mp3"}, {"word": "apocalyptic", "type": "word", "definition": "of, relating to, or involving terrible violence and destruction", "example": "No one listened to her apocalyptic predictions/warnings.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/apocal02.mp3"}, {"word": "apostle", "type": "word", "definition": "any one of the 12 men chosen by Jesus Christ to spread the Christian religion", "example": "Christ's apostles", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/m fore he was scheduled to be executed, the group held a candlelight vigil for him outside the prison. [=they held candles and waited for him to be executed or pardoned]", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/v/vigil001.mp3"}, {"word": "vigilant", "type": "word", "definition": "carefully noticing problems or signs of danger", "example": "When traveling through the city, tourists should be extra vigilant.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/v/vigila02.mp3"}, {"word": "vile", "type": "word", "definition": "evil or immoral", "example": "vile terrorist attacks", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/v/vile0001.mp3"}, {"word": "vindicate", "type": "word", "definition": "to show that (someone) should not be blamed for a crime, mistake, etc. : to show that (someone) is not guilty", "example": "They have evidence that will vindicate [=exonerate] her.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/v/vindic02.mp3"}, {"word": "vindictive", "type": "word", "definition": "having or showing a desire to hurt someone who has hurt or caused problems for you", "example": "He became bitter and vindictive [=spiteful, vengeful] after his divorce.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/v/vindic07.mp3"}, {"word": "virtuoso", "type": "word", "definition": "a person who does something in a very skillful way; especially : a very skillful musician", "example": "He's a real virtuoso in the kitchen.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/v/virtuo03.mp3"}, {"word": "virtuous", "type": "word", "definition": "morally good : having or showing virtue", "example": "a virtuous man/woman", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/v/virtuo05.mp3"}, {"word": "visceral", "type": "word", "definition": "coming from strong emotions and not from logic or reason", "example": "visceral hatred", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/v/viscer01.mp3"}, {"word": "vitality", "type": "word", "definition": "a lively or energetic quality", "example": "the vitality of youth", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/v/vitali04.mp3"}, {"word": "volition", "type": "word", "definition": "the power to make your own choices or decisions", "example": "He left the company {phrase}of his own volition{/phrase}. [=voluntarily, willingly; he left because he wanted to, not because he was forced to]", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/v/voliti01.mp3"}, {"word": "voluptuous", "type": "word", "definition": "very attractive because of having large hips and breasts", "example": "a voluptuous movie star", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/v/volupt02.mp3"}, {"word": "vulgar", "type": "word", "definition": "not having or showing good manners, good taste, or politeness", "example": "He was a vulgar man.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/v/vulgar01.mp3"}, {"word": "vying", "type": "word", "definition": "", "example": "", "audioUrl": ""}, {"word": "wager", "type": "word", "definition": "an agreement in which people try to guess what will happen and the person who guesses wrong has to give something (such as money) to the person who guesses right : bet", "example": "He has a wager on the game.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wager001.mp3"}, {"word": "waggle", "type": "word", "definition": "to move up and down or from side to side repeatedly", "example": "He can waggle his ears.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/waggle01.mp3"}, {"word": "wallow", "type": "word", "definition": "to spend time experiencing or enjoying something without making any effort to change your situation, feelings, etc.\u2014usually + in", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wallow01.mp3"}, {"word": "walrus", "type": "word", "definition": "a large animal that lives on land and in the sea in northern regions and that has flippers and long tusks", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/walrus01.mp3"}, {"word": "wanker", "type": "word", "definition": "a stupid, foolish, or unpleasant person", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wanke01v.mp3"}, {"word": "wanton", "type": "word", "definition": "showing no thought or care for the rights, feelings, or safety of others", "example": "Vandals were guilty of the wanton destruction of the school property.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wanton02.mp3"}, {"word": "warily", "type": "word", "definition": "not having or showing complete trust in someone or something that could be dangerous or cause trouble \u2014often + of", "example": "The store owner kept a wary eye on him.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wary0001.mp3"}, {"word": "whack", "type": "word", "definition": "to hit (someone or something) with great force", "example": "She whacked the pi\u00f1ata with a stick.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/whack001.mp3"}, {"word": "whimsical", "type": "word", "definition": "unusual in a playful or amusing way : not serious", "example": "whimsical behavior", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/whimsi01.mp3"}, {"word": "whinge", "type": "word", "definition": "to complain in an annoying way : whine", "example": "Quit whinging and get on with the job.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/whinge01.mp3"}, {"word": "whistleblower", "type": "word", "definition": "a person who tells police, reporters, etc., about something (such as a crime) that has been kept secret", "example": "a corporate whistle-blower [=a person who works for a corporation and tells people about the corporation's illegal activities]", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/whistl03.mp3"}, {"word": "wimp", "type": "word", "definition": "a weak person who lacks confidence, courage, etc.", "example": "I was too much of a wimp [=coward] to confront him.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wimp0001.mp3"}, {"word": "wimpy", "type": "word", "definition": "a weak person who lacks confidence, courage, etc.", "example": "I was too much of a wimp [=coward] to confront him.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wimp0001.mp3"}, {"word": "wit", "type": "word", "definition": "an ability to say or write things that are clever and usually funny", "example": "She is full of wit and vivacity.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wit00001.mp3"}, {"word": "witty", "type": "word", "definition": "funny and clever", "example": "a witty talk show host", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/witty001.mp3"}, {"word": "wondrous", "type": "word", "definition": "causing wonder or amazement : very beautiful or impressive", "example": "The museum featured a display of wondrous tapestries.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wondro01.mp3"}, {"word": "wreak", "type": "word", "definition": "to cause (something very harmful or damaging) \u2014usually + on or upon", "example": "Gangs have been wreaking mayhem in the city.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wreak001.mp3"}, {"word": "wretched", "type": "word", "definition": "very unhappy, ill, etc.", "example": "The slums were filled with poor, wretched children.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wretch02.mp3"}, {"word": "wriggle", "type": "word", "definition": "to twist from side to side with small quick movements like a worm", "example": "The children wriggled and squirmed in their chairs.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wriggl01.mp3"}, {"word": "wring", "type": "word", "definition": "to twist and squeeze (wet cloth, hair, etc.) to remove water \u2014often + out \u2014sometimes used figuratively", "example": "I wrung the towel and hung it up to dry.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/wring001.mp3"}, {"word": "writhe", "type": "word", "definition": "to twist your body from side to side", "example": "She lay on the floor, writhing in pain.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/w/writhe01.mp3"}, {"word": "xenophobic", "type": "word", "definition": "fear or hatred of strangers or foreigners", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/x/xenoph08.mp3"}, {"word": "yeasty", "type": "word", "definition": "full of or resembling yeast", "example": "yeasty bread dough", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/y/yeasty01.mp3"}, {"word": "yippee", "type": "word", "definition": "\u2014used to express delight or joy", "example": "", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/y/yippee01.mp3"}, {"word": "yowl", "type": "word", "definition": "to make a loud, long cry of grief, pain, or distress", "example": "The cat was yowling outside.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/y/yowl0001.mp3"}, {"word": "zealous", "type": "word", "definition": "feeling or showing strong and energetic support for a person, cause, etc. : filled with zeal", "example": "zealous fans", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/z/zealou01.mp3"}, {"word": "Forfeiture", "type": "word", "definition": "the act of giving up something as punishment or because of a rule or law : the act of forfeiting something", "example": "forfeiture of assets", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/f/forfei03.mp3"}, {"word": "Cyclically", "type": "word", "definition": "happening again and again in the same order : happening in cycles", "example": "cyclic changes in the weather", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/c/cyclic01.mp3"}, {"word": "adjudication", "type": "word", "definition": "to make an official decision about who is right in a dispute", "example": "The board will adjudicate claims made against teachers.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/a/adjudi01.mp3"}, {"word": "longitudinal", "type": "word", "definition": "placed or going along the long side of something", "example": "The insect's body is black with yellow longitudinal stripes.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/l/longit02.mp3"}, {"word": "September", "type": "word", "definition": "the ninth month of the year", "example": "early/mid-/late September", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/s/septem01.mp3"}, {"word": "physiological", "type": "word", "definition": "a science that deals with the ways that living things function", "example": "She took a course in anatomy and physiology.", "audioUrl": "https://media.merriam-webster.com/audio/prons/en/us/mp3/p/physio14.mp3"}];
  const sessionType = "monthly";
  let index = 0, flipped = false, known = 0, learning = 0;

  function deleteUrl(word) {
    const title = encodeURIComponent('vocab-delete: ' + word);
    const body = encodeURIComponent('Requesting removal of "' + word + '" from the word bank -- saved by mistake.');
    return 'https://github.com/Babyblue-Sky/Babyblue-Sky/issues/new?title=' + title + '&body=' + body;
  }

  function render() {
    const app = document.getElementById('app');
    if (words.length === 0) {
      app.innerHTML = '<div class="empty">No words to review for this ' + sessionType + ' session.</div>';
      return;
    }
    if (index >= words.length) {
      app.innerHTML = '<div class="card done"><h2>Review complete</h2><p>' + known + ' known &middot; ' + learning + ' still learning</p></div>';
      return;
    }
    const w = words[index];
    const pct = Math.round((index / words.length) * 100);
    app.innerHTML =
      '<div class="eyebrow"><span>' + (sessionType === 'monthly' ? 'Monthly Review' : 'Weekly Review') + '</span><span>' + (index + 1) + ' / ' + words.length + '</span></div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="card" onclick="flip()">' +
        '<a class="btn-delete" target="_blank" rel="noopener" href="' + deleteUrl(w.word) + '" onclick="event.stopPropagation()">\u2715 not mine, delete</a>' +
        (!flipped
          ? '<h1>' + w.word + '</h1><div class="hint">Tap to reveal definition</div>'
          : '<div class="type-tag">' + w.type + '</div>' +
            '<h2>' + w.word + (w.audioUrl ? ' <button class="btn-audio" onclick="event.stopPropagation(); playAudio(\'' + w.audioUrl + '\')">\ud83d\udd0a</button>' : '') + '</h2>' +
            '<div class="definition">' + (w.definition || '(no definition found)') + '</div>' +
            (w.example ? '<div class="example">' + w.example + '</div>' : '')
        ) +
      '</div>' +
      (flipped
        ? '<div class="buttons"><button class="btn-learning" onclick="rate(false)">Still learning</button><button class="btn-known" onclick="rate(true)">Know it</button></div>'
        : '');
  }

  function flip() { flipped = true; render(); }
  function rate(isKnown) { if (isKnown) known++; else learning++; index++; flipped = false; render(); }
  function playAudio(url) { new Audio(url).play(); }

  render();
</script>
